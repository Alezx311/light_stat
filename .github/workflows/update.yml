name: Update data and deploy

on:
  schedule:
    # Five-minute cadence, offset from the busiest minute at the start of the hour.
    # GitHub may delay scheduled runs; the UI independently expires old snapshots.
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: npm test

      - name: Fetch new channel posts
        run: node tools/fetch-telegram.js

      - name: Commit event store
        run: |
          # The check time changes every run; commit only when posts were added.
          if ! git diff -U0 -- data/events.json | grep -E '^[+-][^+-]' | grep -qv '"observedUntil"'; then
            echo "No new posts"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          git commit -m "data: оновлення подій каналу"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Build site
        run: node tools/build-site.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
